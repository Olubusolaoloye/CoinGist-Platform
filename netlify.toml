# Netlify deploy of the public site (apps/web). It reads stories from the production API,
# which runs on the Studio site (API_URL, set in the Netlify site's environment variables).
[build]
  base = "apps/web"
  command = "DEPLOY_TARGET=netlify pnpm build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.0"

# Static caching. Hashed build files never change; public files keep fixed names, so a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo-512.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
