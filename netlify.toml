# Netlify deploy of the public site (apps/web). It reads stories from the production API,
# which runs on the Studio site (API_URL, set in the Netlify site's environment variables).
[build]
  base = "apps/web"
  command = "DEPLOY_TARGET=netlify pnpm build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.0"

# Static caching. Hashed build files never change; public files keep fixed names, so a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/covers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo-512.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The service worker must update promptly; the manifest and icons rarely change.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify Image CDN may resize uploads from Supabase Storage (see app/lib/image.ts).
[images]
  remote_images = ["https://[a-z0-9]+\\.supabase\\.co/storage/v1/object/public/.*"]
