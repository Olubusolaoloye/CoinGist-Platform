# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem
# to keep the noise down; majors arrive one at a time so each can be reviewed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
